# Local / single-server deployment. Secrets come from `.env` (never commit it).
#   docker compose up -d db
#   docker compose run --rm migrate                         # migrations + roles/permissions
#   docker compose run --rm migrate npm run bootstrap:admin # first Super Admin (once)
#   docker compose up -d app
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-watcon}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watcon}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-watcon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-watcon}
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-watcon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-watcon}
    # Bound to localhost only: the app is reached through the Nginx/TLS reverse proxy,
    # never directly (direct exposure would also let clients spoof X-Real-IP).
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
